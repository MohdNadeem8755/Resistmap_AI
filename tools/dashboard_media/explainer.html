<!doctype html><meta charset="utf-8"><canvas id="film" width="1280" height="720"></canvas>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');
const cream='#f2f5e9',mint='#c5df9e',coral='#ecb28d',muted='#a6c2b2';
const scenes=[
['THE QUESTION','Small sequences.','Bigger understanding.','A connected workspace for antibiotic resistance research.'],
['01 / CONNECT','Start with evidence.','Keep its origin.','Match genomes and laboratory phenotypes by BioSample.'],
['02 / CHECK','Quality comes first.','Every genome matters.','Verify integrity, species, assembly quality and read evidence.'],
['03 / DISCOVER','From DNA to features.','From patterns to clues.','Extract gene, allele and mutation evidence for analysis.'],
['04 / VALIDATE','Train with care.','Test on fresh data.','Separate BioProjects. Compare both classes. Freeze choices.'],
['05 / EXPLORE','Make evidence visible.','Make research clearer.','Explore charts, review samples and export the evidence.']];
function txt(s,x,y,size=24,color=cream,weight=400){g.fillStyle=color;g.font=`${weight} ${size}px "Segoe UI", sans-serif`;g.fillText(s,x,y)}
function line(x,y,x2,y2,color,width=2){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}
function dot(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function box(x,y,w,h,color='#2b594d',r=16){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function helix(t,x=965,y=150){for(let i=0;i<24;i++){let a=Math.sin(i*.38+t)*93,b=y+i*15;line(x-a,b,x+a,b,i%3? '#548d76':coral,2);dot(x-a,b,4,mint);dot(x+a,b,4,i%3? '#72b69b':coral)}}
function card(x,y,title,detail,accent=mint){box(x,y,350,85);dot(x+25,y+30,5,accent);txt(title,x+44,y+37,18,cream,600);txt(detail,x+25,y+65,13,muted)}
function draw(time){const scene=Math.min(5,Math.floor(time/10)),t=time%10,s=scenes[scene];g.fillStyle='#163e34';g.fillRect(0,0,1280,720);
 const grd=g.createRadialGradient(1040,330,10,1040,330,550);grd.addColorStop(0,'#315d49');grd.addColorStop(1,'#163e34');g.fillStyle=grd;g.fillRect(0,0,1280,720);
 for(let j=0;j<3;j++){g.strokeStyle='#7ba99020';g.lineWidth=1;g.beginPath();g.arc(990,340,160+j*63,0,Math.PI*2);g.stroke()}
 dot(89,71,20,mint);g.save();g.translate(89,69);g.scale(.17,.17);for(let i=0;i<8;i++){let a=Math.sin(i*.65)*58;line(-a,-60+i*18,a,-60+i*18,'#214d40',12)}g.restore();txt('ResistMap',122,80,29,cream,600);txt('AI',268,80,15,coral,600);txt('GENOMIC INTELLIGENCE',940,76,12,muted,600);
 const fade=Math.min(1,t/0.6,(10-t)/.5);g.save();g.globalAlpha=Math.max(0,fade);g.translate(0,Math.max(0,1-t/.6)*16);
 txt(s[0],82,206,14,coral,600);txt(s[1],78,284,49,cream,600);txt(s[2],78,347,49,mint,600);txt(s[3],82,408,19,muted);
 if(scene===0){helix(time);txt('SURVEILLANCE  /  RESISTANCE  /  EARLY WARNING',82,502,13,mint,600);txt('Follow the evidence. Understand the signal.',82,542,21,cream)}
 if(scene===1){card(820,169,'Genome sources','NCBI assemblies + ENA reads');card(820,289,'BioSample link','Traceable sample identity',coral);card(820,409,'Laboratory labels','CLSI susceptible / resistant');for(let y of [254,374]){line(952,y,952,y+35,'#8db795',2);dot(952,y+(t*11)%35,4,coral)}box(82,465,304,94,'#244d40');txt('445',104,510,36,mint,600);txt('development samples',104,540,17,muted)}
 if(scene===2){['Checksum & provenance','Species & assembly stats','Read mapping & flags','Contamination assessment'].forEach((q,i)=>{let y=184+i*81;box(805,y,366,63);dot(834,y+31,11,i===3?coral:mint);if(i<3){line(829,y+31,833,y+35,'#244d40',2);line(833,y+35,840,y+26,'#244d40',2)}txt(q,858,y+39,18,cream)});txt('Keep review flags visible.',82,490,22,mint,600);txt('Quality checks support interpretation;',82,530,19,muted);txt('they do not replace expert review.',82,560,19,muted)}
 if(scene===3){const genes=['Gene presence','Allele identity','Mutation states'];genes.forEach((q,i)=>{box(825,177+i*108,295,84);txt(q,848,209+i*108,19,cream,600);for(let j=0;j<9;j++)box(848+j*26,224+i*108,15,15,(j+i)%3===0?coral:'#709c72',3)});txt('AMRFinderPlus → model features',82,490,23,mint,600);txt('Anomaly patterns are review signals.',82,531,19,muted);txt('Surveillance and labelled cohorts stay distinct.',82,563,19,muted)}
 if(scene===4){['Grouped development CV','Model + threshold selection','Fresh independent validation'].forEach((q,i)=>card(820,163+i*125,q,i===0?'Project separation + overlap checks':i===1?'Use development data only':'Accuracy + class recalls + uncertainty',i===2?coral:mint));txt('AUC ≠ accuracy',82,489,28,mint,600);txt('99% is a target, not an established result.',82,536,20,coral)}
 if(scene===5){box(795,170,385,308,'#e9efe3');box(808,183,72,282,'#d9e3d4',8);for(let i=0;i<5;i++)box(821,220+i*31,45,9,i===0?'#35604e':'#a4bba2',3);for(let i=0;i<3;i++)box(895+i*90,190,78,49,i===1?'#edd6bd':'#ccddbe',7);for(let i=0;i<7;i++){let h=(Math.sin(i*1.8)+1.5)*31*Math.min(1,t/1.5);box(903+i*33,362-h,17,h,i%2?'#809e69':'#3c6b58',3)}line(896,366,1162,366,'#bdcdbc',1);for(let i=0;i<6;i++){box(895,387+i*12,264,6,i%2?'#d7e1d2':'#b9cdb3',2)}txt('Your research, connected.',82,490,26,mint,600);txt('Research workspace · expert evidence review',82,535,18,muted)}
 g.restore();line(82,613,1198,613,'#7aa18e36',1);for(let i=0;i<6;i++){box(82+i*188,613,174,3,'#396351',1);if(i<=scene)box(82+i*188,613,174*(i===scene?t/10:1),3,mint,1)}txt('WORKFLOW ANIMATION',82,662,12,muted,600);txt(`${String(Math.floor(time)).padStart(2,'0')} / 60`,1110,663,14,mint);txt('Connect  →  Check  →  Discover  →  Validate  →  Explore',375,662,13,muted);
}
draw(0);
window.recordFilm=async()=>{const stream=c.captureStream(24);const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm;codecs=vp8';const recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:1800000});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const stopped=new Promise(r=>recorder.onstop=r);recorder.start(1000);const start=performance.now();await new Promise(resolve=>{function step(){const t=(performance.now()-start)/1000;draw(Math.min(t,59.98));if(t<60)requestAnimationFrame(step);else resolve()}requestAnimationFrame(step)});recorder.stop();await stopped;stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resistmap-explainer.webm';a.click();return blob.size};
</script>
